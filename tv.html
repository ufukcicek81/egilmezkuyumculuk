<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef4f8">
<title>Eğilmez Kuyumculuk TV</title>
<style>
:root{
  --bg:#eef4f8;--card:#f8fbfd;--card2:#e7eef4;--line:#cbd7e0;
  --text:#172235;--muted:#65758a;--red:#e21a1a;--green:#0f7f32;--blue:#1267d6;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#f6fafd,#eaf1f6);color:var(--text)}
body.dark{--bg:#0d141b;--card:#111a22;--card2:#18232d;--line:#2b3b48;--text:#edf5fb;--muted:#9fb0be;--red:#ff6a67;--green:#55d486;--blue:#69b8ff;background:linear-gradient(180deg,#0b1117,#101820)}
.app{height:100vh;padding:10px 14px 12px;display:grid;grid-template-rows:72px 76px minmax(0,1fr);gap:8px}
.top{position:relative;display:flex;align-items:center;justify-content:center}
.logo{height:68px;max-width:280px;object-fit:contain}
body:not(.dark) .logo{filter:brightness(0) saturate(100%) sepia(20%) saturate(650%) hue-rotate(338deg) brightness(45%) contrast(96%)}
.theme{position:absolute;right:5px;top:12px;width:82px;height:42px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--text);font-size:18px}
.status{display:grid;grid-template-columns:1.25fr .75fr .75fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 4px 14px rgba(30,50,64,.08)}
.status>div{padding:8px 16px;display:flex;flex-direction:column;justify-content:center}.status>div+div{border-left:1px solid var(--line)}
.live{font-size:20px;font-weight:950}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#14c978;margin-right:7px;box-shadow:0 0 12px rgba(20,201,120,.55)}
.sub,.lab{font-size:12px;color:var(--muted)}.val{font-size:29px;font-weight:950}.status>div:last-child .val{color:var(--green)}
.dashboard{display:grid;grid-template-columns:minmax(0,70fr) minmax(310px,30fr);gap:10px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px rgba(28,45,58,.08);min-height:0}
.gold{display:grid;grid-template-rows:42px 32px minmax(0,1fr)}
.title{padding:0 16px;display:flex;align-items:center;font-size:21px;font-weight:950;border-bottom:1px solid var(--line)}
.head,.row{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr;align-items:center}
.head{padding:0 14px;background:var(--card2);font-size:12px;font-weight:900;color:var(--muted);border-bottom:1px solid var(--line)}
.head span:not(:first-child),.num{text-align:right}.head span:nth-child(2){color:var(--red)}.head span:nth-child(3){color:var(--green)}.head span:nth-child(4){color:var(--blue)}
.rows{display:grid;grid-auto-rows:minmax(0,1fr);min-height:0}
.row{padding:2px 14px;border-bottom:1px solid var(--line)}.row:nth-child(even){background:rgba(120,145,165,.055)}
.name{font-size:var(--namefs,15px);font-weight:900}.num{font-size:var(--numfs,18px);font-weight:950;line-height:1}.buy{color:var(--red)}.sell{color:var(--green)}.cc{color:var(--blue)}
.chg{display:block;font-size:var(--chgfs,8px);margin-top:2px;font-weight:850}
.side{display:grid;grid-template-rows:minmax(0,1.1fr) minmax(0,.9fr);gap:10px;min-height:0}
.sidecard{display:grid;grid-template-rows:42px 30px minmax(0,1fr)}
.side-title{padding:0 14px;display:flex;align-items:center;font-size:18px;font-weight:950;border-bottom:1px solid var(--line)}
.fx .side-title{color:var(--blue)}
.side-head,.side-row{display:grid;grid-template-columns:1.25fr .75fr .75fr;align-items:center}.side-head{padding:0 12px;background:var(--card2);font-size:11px;font-weight:900;color:var(--muted);border-bottom:1px solid var(--line)}
.side-head span:nth-child(2){color:var(--red)}.side-head span:nth-child(3){color:var(--green)}.side-head span:not(:first-child),.side-row span:not(:first-child){text-align:right}
.side-rows{display:grid;grid-auto-rows:minmax(0,1fr);min-height:0}.side-row{padding:1px 12px;border-bottom:1px solid var(--line)}.side-row:nth-child(even){background:rgba(120,145,165,.045)}
.side-name{font-size:var(--sidefs,14px);font-weight:900}.side-num{font-size:var(--sideval,17px);font-weight:950}.side-num.buy{color:var(--red)}.side-num.sell{color:var(--green)}
@keyframes flashUp{0%{background:rgba(15,127,50,.22)}100%{background:transparent}}
@keyframes flashDown{0%{background:rgba(226,26,26,.20)}100%{background:transparent}}
.flash-up{animation:flashUp .65s ease-out}.flash-down{animation:flashDown .65s ease-out}
@media(max-height:760px){.app{grid-template-rows:56px 58px minmax(0,1fr);gap:5px;padding:6px 9px}.logo{height:52px}.theme{top:7px;height:36px}.status>div{padding:4px 10px}.live{font-size:15px}.sub,.lab{font-size:9px}.val{font-size:21px}.title,.side-title{height:auto;font-size:15px}.gold{grid-template-rows:32px 25px minmax(0,1fr)}.sidecard{grid-template-rows:32px 24px minmax(0,1fr)}}
</style>

<style id="egilmez-v81-tv-options">
#hasA{color:var(--red)!important}
#hasS{color:var(--green)!important}
.dashboard.only-gold{grid-template-columns:1fr!important}
.dashboard.only-gold #sidePanel{display:none!important}
#sidePanel.one-card{grid-template-rows:minmax(0,1fr)!important}
#sidePanel.one-card .sidecard{min-height:0!important}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <img id="logo" class="logo" src="egilmez-logo-clean.png" alt="Eğilmez Kuyumculuk">
    <button id="theme" class="theme">☀ / ☾</button>
  </div>
  <div class="status">
    <div><div class="live"><span class="dot"></span>Piyasa Canlı</div><div class="sub">Son güncelleme: <span id="time">--:--:--</span></div></div>
    <div><div class="lab">Has Alış</div><div class="val" id="hasA">—</div></div>
    <div><div class="lab">Has Satış</div><div class="val" id="hasS">—</div></div>
  </div>
  <div class="dashboard" id="dashboard">
    <div class="card gold">
      <div class="title">🪙 Altın Fiyatları</div>
      <div class="head"><span>Birim</span><span>Alış</span><span>Satış</span><span>K. Kartı</span></div>
      <div class="rows" id="goldRows"></div>
    </div>
    <div class="side" id="sidePanel">
      <div class="card sidecard fx" id="fxCard">
        <div class="side-title">💱 DÖVİZ KURLARI</div>
        <div class="side-head"><span>Döviz</span><span>Alış</span><span>Satış</span></div>
        <div class="side-rows" id="fxRows"></div>
      </div>
      <div class="card sidecard" id="scrapCard">
        <div class="side-title">🪙 HURDA ALTIN</div>
        <div class="side-head"><span>Tür</span><span>Alış</span><span>Satış</span></div>
        <div class="side-rows" id="scrapRows"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var FB='https://egilmez-kuyumculuk-default-rtdb.europe-west1.firebasedatabase.app/ayarlar.json';
var WORKER='https://altin-proxy.ufuk87900.workers.dev';
var settings={labor:{},laborH:{},customItems:[],kkOran:0,dovizDuz:{},hurdaCarp:{},theme:'light',tvShowDoviz:true,tvShowHurda:true};
var hasA=0,hasS=0,live={},prev={},busy1=false,busy2=false;
var ITEMS=[
{id:'has24',label:'24 Ayar',defA:1,defS:1.003},{id:'ayar22',label:'22 Ayar',defA:.91,defS:.922},
{id:'tam',label:'Tam',defA:.993,defS:1.008},{id:'yarim',label:'Yarım',defA:.993,defS:1.009},
{id:'ceyrek',label:'Çeyrek',defA:.992,defS:1.01},{id:'besli',label:'Beşli',defA:.993,defS:1.008},
{id:'yarimbes',label:'Yarım Beşli',defA:.993,defS:1.0085},{id:'resat',label:'Reşat',defA:.993,defS:1.007},
{id:'ata',label:'Ata',defA:.993,defS:1.007},{id:'gremise',label:'Gremise',defA:.993,defS:1.008}
];
var FX=[['usd','🇺🇸','USD'],['eur','🇪🇺','EUR'],['gbp','🇬🇧','GBP'],['sar','🇸🇦','SAR'],['chf','🇨🇭','CHF']];
var SCR=[['hurda22','22 Ayar Hurda',22/24],['hurda14','14 Ayar Hurda',14/24],['hurda8','8 Ayar Hurda',8/24]];
function fmt(n){return new Intl.NumberFormat('tr-TR').format(Math.round(n))}
function allItems(){var a=ITEMS.concat(settings.customItems||[]),map={},out=[];(a||[]).forEach(x=>map[x.id]=x);(settings.itemOrder||[]).forEach(id=>{if(map[id]){out.push(map[id]);delete map[id]}});a.forEach(x=>{if(map[x.id])out.push(x)});var hid=settings.hiddenItems||[],del=settings.deletedItems||[];return out.filter(x=>hid.indexOf(x.id)<0&&del.indexOf(x.id)<0)}
function lab(i){return (settings.labor&&settings.labor[i.id])||{a:i.defA||1,s:i.defS||1}}
function pct(key,n){var o=prev[key],t='%0.00';if(o&&n&&o!==n){var d=(n-o)/o*100;t=(d>0?'+':'')+d.toFixed(2)+'%'}prev[key]=n;return t}
function flash(key,n){var o=prev[key];if(o&&n&&o!==n)return n>o?' flash-up':' flash-down';return''}

function applyTvPanelOptions(){
  if(typeof settings.tvShowDoviz!=='boolean')settings.tvShowDoviz=true;
  if(typeof settings.tvShowHurda!=='boolean')settings.tvShowHurda=true;

  var fx=document.getElementById('fxCard');
  var hu=document.getElementById('scrapCard');
  var side=document.getElementById('sidePanel');
  var dash=document.getElementById('dashboard');

  if(fx)fx.style.display=settings.tvShowDoviz?'grid':'none';
  if(hu)hu.style.display=settings.tvShowHurda?'grid':'none';

  var any=settings.tvShowDoviz||settings.tvShowHurda;
  if(dash)dash.classList.toggle('only-gold',!any);
  if(side){
    side.style.display=any?'grid':'none';
    side.classList.toggle('one-card', any && !(settings.tvShowDoviz&&settings.tvShowHurda));
  }
}

function render(){
  applyTvPanelOptions();
  document.getElementById('hasA').textContent=hasA?fmt(hasA):'—';document.getElementById('hasS').textContent=hasS?fmt(hasS):'—';
  if(settings.logoData&&settings.customLogoEnabled)document.getElementById('logo').src=settings.logoData;
  var list=allItems(),g='';var kk=Number(settings.kkOran)||0;
  list.forEach(function(i){var l=lab(i),a=hasA?Math.round(hasA*(Number(l.a)||i.defA||1)):0,s=hasS?Math.round(hasS*(Number(l.s)||i.defS||1)):0,k=s?Math.round(s*(1+kk/100)):0;
    var fa=flash(i.id+'_a',a),fs=flash(i.id+'_s',s),pa=pct(i.id+'_a',a),ps=pct(i.id+'_s',s);
    g+='<div class="row"><span class="name">'+i.label+'</span><span class="num buy'+fa+'">'+(a?fmt(a):'—')+'<small class="chg">'+pa+'</small></span><span class="num sell'+fs+'">'+(s?fmt(s):'—')+'<small class="chg">'+ps+'</small></span><span class="num cc">'+(k?fmt(k):'—')+'</span></div>';
  });document.getElementById('goldRows').innerHTML=g;
  var f='';FX.forEach(function(x){var da=Number((settings.dovizDuz||{})[x[0]+'A'])||0,ds=Number((settings.dovizDuz||{})[x[0]+'S'])||0,a=live[x[0]+'Alis'],s=live[x[0]+'Satis'];f+='<div class="side-row"><span class="side-name">'+x[1]+' '+x[2]+'</span><span class="side-num buy">'+(a?(Number(a)+da).toFixed(2):'—')+'</span><span class="side-num sell">'+(s?(Number(s)+ds).toFixed(2):'—')+'</span></div>'});document.getElementById('fxRows').innerHTML=f;
  var h='';SCR.forEach(function(x){var ca=Number((settings.hurdaCarp||{})[x[0]+'A'])||x[2]*.99,cs=Number((settings.hurdaCarp||{})[x[0]+'S'])||x[2];h+='<div class="side-row"><span class="side-name">'+x[1]+'</span><span class="side-num buy">'+(hasA?fmt(hasA*ca):'—')+'</span><span class="side-num sell">'+(hasS?fmt(hasS*cs):'—')+'</span></div>'});document.getElementById('scrapRows').innerHTML=h;
  fit();
}
function fit(){var n=document.querySelectorAll('#goldRows .row').length||1,area=document.getElementById('goldRows').getBoundingClientRect().height,r=area/n,cl=(v,a,b)=>Math.max(a,Math.min(b,v));document.documentElement.style.setProperty('--namefs',cl(r*.32,10,18)+'px');document.documentElement.style.setProperty('--numfs',cl(r*.37,11,21)+'px');document.documentElement.style.setProperty('--chgfs',cl(r*.16,6,10)+'px');var sn=document.querySelectorAll('#fxRows .side-row').length||1,sa=document.getElementById('fxRows').getBoundingClientRect().height,sr=sa/sn;document.documentElement.style.setProperty('--sidefs',cl(sr*.31,9,17)+'px');document.documentElement.style.setProperty('--sideval',cl(sr*.36,10,20)+'px')}
function theme(){var d=localStorage.getItem('egilmez_theme_local')||settings.theme||'light';document.body.classList.toggle('dark',d==='dark')}
document.getElementById('theme').onclick=function(){var d=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('egilmez_theme_local',d);theme()}
async function loadSettings(){if(busy1)return;busy1=true;try{var r=await fetch(FB+'?v='+Date.now(),{cache:'no-store'});if(r.ok){var x=await r.json();if(x&&typeof x==='object'){settings=Object.assign(settings,x);theme();render()}}}catch(e){}busy1=false}
async function loadPrices(){if(busy2)return;busy2=true;try{var r=await fetch(WORKER+'?v='+Date.now(),{cache:'no-store'});if(r.ok){var d=await r.json();live=d||{};var a=Number(d.hasAlis),s=Number(d.hasSatis);if(a>100&&s>100){hasA=a+(Number(settings.hasDuzA)||0);hasS=s+(Number(settings.hasDuzS)||0);document.getElementById('time').textContent=new Date().toLocaleTimeString('tr-TR');render()}}}catch(e){}busy2=false}
theme();loadSettings();loadPrices();setInterval(loadSettings,2500);setInterval(loadPrices,2000);addEventListener('resize',fit);
})();
</script>
</body>
</html>
